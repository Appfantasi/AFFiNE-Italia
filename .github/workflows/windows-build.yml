name: Build AFFiNE Italia for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - affine-italia/windows-build
    paths:
      - '.github/workflows/windows-build.yml'
      - 'packages/**'
      - 'blocksuite/**'
      - 'tools/**'
      - 'package.json'
      - 'yarn.lock'
      - '.yarnrc.yml'
      - 'rust-toolchain.toml'
      - '.nvmrc'

permissions:
  contents: read

concurrency:
  group: affine-italia-windows-build
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Enable Git symbolic links
        shell: pwsh
        run: git config --global core.symlinks true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable pinned Yarn
        shell: pwsh
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          node --version
          yarn --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version

      - name: Install dependencies
        shell: pwsh
        run: yarn install --immutable

      - name: Build AFFiNE native modules
        shell: pwsh
        run: yarn affine @affine/native build

      - name: Generate desktop web assets
        shell: pwsh
        env:
          BUILD_TYPE: canary
          DISTRIBUTION: desktop
        run: |
          yarn affine @affine/electron generate-assets
          $webStatic = "packages/frontend/apps/electron/resources/web-static"
          if (!(Test-Path "$webStatic/index.html")) {
            throw "Desktop web assets were not generated: $webStatic/index.html is missing"
          }
          $assetCount = (Get-ChildItem -Path $webStatic -Recurse -File | Measure-Object).Count
          if ($assetCount -lt 10) {
            throw "Desktop web assets look incomplete: only $assetCount files found"
          }
          Write-Host "Verified $assetCount desktop web asset files"

      - name: Configure Yarn for Electron packaging
        shell: pwsh
        run: |
          yarn config set nmMode classic
          yarn config set nmHoistingLimits workspaces

      - name: Reinstall dependencies with Electron-compatible layout
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Directory -Filter node_modules -Recurse -Force |
            Sort-Object { $_.FullName.Length } -Descending |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Recurse -Force }
          yarn install --immutable

      - name: Package Windows desktop application
        shell: pwsh
        env:
          BUILD_TYPE: canary
          SKIP_WEB_BUILD: '1'
          HOIST_NODE_MODULES: '1'
          NODE_OPTIONS: --max-old-space-size=14384
        run: |
          yarn affine @affine/electron package
          yarn affine @affine/electron make-squirrel
          yarn affine @affine/electron make-nsis

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: AFFiNE-Italia-Windows-Installers
          path: packages/frontend/apps/electron/out/canary/make/**
          if-no-files-found: error
          retention-days: 14
